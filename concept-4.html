<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b13;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,177.68vh);aspect-ratio:1672/941;max-width:100vw;max-height:100vh;background:#08111d;overflow:hidden}
.ref{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none}
.hotspot{position:absolute;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;outline:none}
.hotspot:hover,.hotspot:focus{border-color:rgba(81,169,255,.9);background:rgba(22,112,255,.09);box-shadow:0 0 22px rgba(0,125,255,.18)}
.hotspot::after{content:attr(data-label);position:absolute;left:6px;top:6px;padding:4px 7px;border-radius:6px;background:rgba(4,10,20,.9);border:1px solid rgba(255,255,255,.15);font-size:11px;color:#dceeff;opacity:0;pointer-events:none;white-space:nowrap}
.hotspot:hover::after,.hotspot:focus::after{opacity:1}
.toast{position:absolute;right:2%;bottom:2%;max-width:42%;padding:11px 13px;border-radius:10px;background:rgba(4,12,22,.94);border:1px solid rgba(79,168,255,.45);font-size:12px;line-height:1.4;opacity:0;transform:translateY(10px);transition:.18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#39e58c;box-shadow:0 0 10px rgba(57,229,140,.8);margin-right:6px}
.control{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);display:flex;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.1);background:rgba(3,9,18,.8);border-radius:999px;opacity:0;transition:.18s}
.stage:hover .control{opacity:1}
.control button{border:0;border-radius:999px;padding:6px 9px;background:#15263a;color:#dceaff;font-size:11px;cursor:pointer}
.drawer{position:absolute;right:1.5%;top:8%;width:27%;max-height:82%;overflow:auto;padding:15px;border-radius:14px;background:rgba(5,13,24,.97);border:1px solid rgba(97,173,255,.35);transform:translateX(120%);transition:.2s}
.drawer.open{transform:none}
.drawer h3{margin:0 0 7px;font-size:15px}.drawer p{margin:0 0 10px;color:#a9bad0;font-size:12px;line-height:1.4}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.switch{width:36px;height:20px;border-radius:20px;background:#263548;position:relative;cursor:pointer}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.16s}
.switch.on{background:#1bcf72}.switch.on::after{left:19px}
</style>

<div class="control">
<button id="inspect" type="button">Interações</button>
<button id="fullscreen" type="button">Tela cheia</button>
<button id="reset" type="button">Reset</button>
</div>
<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>
<aside class="drawer" id="drawer">
<h3 id="drawerTitle">Painel</h3>
<p id="drawerText">Área interativa do protótipo.</p>
<div class="row"><span>Missão ativa</span><div class="switch on" data-key="mission"></div></div>
<div class="row"><span>AUGUSTO reporta</span><div class="switch" data-key="reporter"></div></div>
<div class="row"><span>Autoabrir no Linux</span><div class="switch on" data-key="startup"></div></div>
</aside>
</div>
<script>
const state={mission:true,reporter:false,startup:true,monitoring:true,daily:true,notifications:true,focus:false,silent:false,missionAware:true};
const toast=document.getElementById('toast');
const toastText=document.getElementById('toastText');
const drawer=document.getElementById('drawer');
const drawerTitle=document.getElementById('drawerTitle');
const drawerText=document.getElementById('drawerText');
let timer=null;
function say(message){
  clearTimeout(timer);
  toastText.textContent=message;
  toast.classList.add('show');
  timer=setTimeout(()=>toast.classList.remove('show'),1800);
}
function sync(){
  document.querySelectorAll('.switch').forEach(sw=>sw.classList.toggle('on',Boolean(state[sw.dataset.key])));
}
function toggle(key,label){
  state[key]=!state[key];
  if(key==='reporter' && state[key] && !state.mission){
    state[key]=false;
    say('AUGUSTO só reporta com missão ativa.');
    sync();
    return;
  }
  say(label+': '+(state[key]?'ativado':'desativado'));
  sync();
}
document.querySelectorAll('.hotspot').forEach(h=>{
  h.addEventListener('click',()=>{
    const type=h.dataset.type;
    const target=h.dataset.target;
    const label=h.dataset.label;
    if(type==='toggle'){toggle(target,label);return;}
    if(type==='action'){say(target||label);return;}
    drawerTitle.textContent=label;
    drawerText.textContent='Área interativa: '+target+'. Na versão funcional, este painel receberá dados reais do GitHub e do MCF.';
    drawer.classList.add('open');
    say(label+' selecionado');
  });
});
document.querySelectorAll('.switch').forEach(sw=>sw.addEventListener('click',()=>toggle(sw.dataset.key,sw.parentElement.firstElementChild.textContent)));
document.getElementById('inspect').addEventListener('click',()=>drawer.classList.toggle('open'));
document.getElementById('fullscreen').addEventListener('click',()=>{
  const stage=document.getElementById('stage');
  if(document.fullscreenElement){document.exitFullscreen();}
  else if(stage.requestFullscreen){stage.requestFullscreen();}
});
document.getElementById('reset').addEventListener('click',()=>{
  Object.assign(state,{mission:true,reporter:false,startup:true,monitoring:true,daily:true,notifications:true,focus:false,silent:false,missionAware:true});
  drawer.classList.remove('open');
  sync(); say('Protótipo restaurado');
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')drawer.classList.remove('open');
  if(e.key.toLowerCase()==='a')toggle('reporter','AUGUSTO');
});
sync();
</script>
<script src="/assets/fidelity-live.js"></script>
